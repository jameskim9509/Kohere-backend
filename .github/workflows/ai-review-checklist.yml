name: AI Review Checklist

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-review-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed-files.txt
          cat changed-files.txt
      - name: Comment checklist
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changed = fs.readFileSync('changed-files.txt', 'utf8');
            const body = `## AI Review Checklist\n\n변경 파일:\n\n\`\`\`\n${changed}\n\`\`\`\n\n- [ ] 요구사항과 변경 내용이 일치하는가?\n- [ ] 테스트가 추가/수정되었는가?\n- [ ] 문서가 갱신되었는가?\n- [ ] 보안/Secret 노출이 없는가?\n- [ ] 운영 리스크가 PR에 설명되었는가?\n- [ ] Claude Code 생성 코드를 사람이 검토했는가?`;
            github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
