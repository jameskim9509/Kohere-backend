name: Docs Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - ".claude/**"

jobs:
  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check baseline docs
        run: |
          test -f README.md
          test -f CLAUDE.md
          test -f docs/index.md
          echo "Docs baseline OK"
