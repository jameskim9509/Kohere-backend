# ── errors[].reason — Bean Validation 제약과 바인딩 실패의 필드별 사유 ───────────
# 키는 Spring 이 FieldError 에 붙이는 코드다(<제약>.<객체>.<필드> → <제약>.<필드> → <제약>).
# 키가 없으면 제약의 기본 문구(영문)나 바인딩 실패의 내부 문구가 그대로 노출된다.
NotBlank=This field is required.
NotNull=This field is required.
NotEmpty=This field is required.
Past=Must be a past date.
Email=Must be a valid email address.
Positive=Must be greater than 0.
Size=The length is out of the allowed range.
Pattern=The format is invalid.
typeMismatch=The value has an unexpected type.
# 값 범위를 알려줘야 고칠 수 있는 자리는 필드별로 둔다.
Pattern.answerQuizRequest.selectedChoice=Must be one of A, B, C, D.
Size.bookingReportRequest.detail=Must be 500 characters or fewer.
# ── errors[].reason — 서비스가 던지는 InvalidInputException 의 사유 ─────────────
# 키는 InvalidInputException(field, reasonCode, args...) 의 reasonCode 다.
# 문구의 {0}·{1}은 호출부가 넘긴 인자로 채운다(MessageFormat).
validation.required=This field is required.
validation.requiredForStep=This field is required at the {0} step.
validation.min=Must be {0,number,#} or greater. Received: {1,number,#}
validation.range=Must be between {0,number,#} and {1,number,#}. Received: {2,number,#}
validation.lengthRange=Must be between {0,number,#} and {1,number,#} characters. Received: {2,number,#}
validation.notAllowed=Not an allowed value: {0}
validation.maxSelections=You may select at most {0,number,#}. Selected: {1,number,#}
validation.notGreaterThan=Must not be greater than {0}. Received: {1,number,#} > {2,number,#}
validation.sortKey=Unknown sort key: {0}
validation.sortDirection=Unknown sort direction: {0}
validation.currentQuestionRequired=An answer to the current question is required.
validation.notCurrentQuestion=Not the current question: {0}
validation.onlyForPurpose=Allowed only when purpose={0}
validation.yesOrNo=Must be YES or NO. Received: {0}
validation.unsupportedCountry=Unsupported country code: {0}
validation.unsupportedLanguage=Unsupported display language: {0}
validation.dateFormat=Must be in YYYY-MM-DD format. Received: {0}
validation.pastDate=Must be a past date. Received: {0}
validation.rangeFormat=Must be in min~max format (e.g. 1~2). Received: {0}
