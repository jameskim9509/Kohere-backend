# 운영 프로파일(SPRING_PROFILES_ACTIVE=prod). 모든 환경 의존값·시크릿은 환경변수/Secrets Manager로 주입한다.
# 폴백 기본값을 두지 않는다 — 누락 시 기동이 실패(fail-fast)해 "조용히 커밋된 시크릿 사용" 사고를 막는다.
# 스키마는 Flyway가 적용하고 Hibernate는 validate만 한다(ADR-0008).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # 로그 JSON 파일 디렉터리(logback-spring.xml의 JSON_FILE). ECS 태스크의 로그 파일 경로. 반출은 awslogs 드라이버(stdout)가 담당한다(ADR-0038).
  log:
    dir: ${APP_LOG_DIR:/logs}
  jwt:
    secret: ${JWT_SECRET} # 미설정 시 기동 실패 (ADR-0011 D5)
  auth:
    refresh-pepper: ${REFRESH_PEPPER} # ADR-0006
    email-pepper: ${EMAIL_PEPPER} # 이메일 인증번호 해시 pepper
    phone-pepper: ${PHONE_PEPPER} # 연락처 인증번호 해시 pepper(SSM, ADR-0023)
  oidc:
    google:
      audience: ${GOOGLE_CLIENT_ID}
    apple:
      audience: ${APPLE_CLIENT_ID}
  apple:
    # Apple 인가코드 흐름 시크릿. client-id는 oidc.apple.audience와 같은 번들 ID(같은 env 재사용).
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY} # .p8 PKCS#8 PEM — 절대 로깅 금지
  mail:
    # 인증번호 메일 발송 채널. dev 와 같은 이유로 폴백 없이 주입을 강제한다 — 운영에서 false 는 조용한 사고다
    # (가입용 이메일 인증이 전 환경에서 동작하므로 이 값이 꺼지면 신규 임대인이 가입을 마칠 수 없다).
    enabled: ${MAIL_ENABLED}
  solapi:
    # 연락처 SMS(SOLAPI, ADR-0034). enabled·from·API 키 모두 env(평문)/SSM(시크릿)로 주입(폴백 없음 — 미설정 시 기동 실패).
    enabled: ${SOLAPI_ENABLED}
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET} # 1급 시크릿(SSM)
    from: ${SOLAPI_FROM} # 사전 등록 발신번호
  bizno:
    # 사업자번호 검증(비즈노, ADR-0033). enabled·API 키 모두 env/SSM로 주입(폴백 없음).
    enabled: ${BIZNO_ENABLED}
    api-key: ${BIZNO_API_KEY} # 시크릿(SSM)
  naver:
    search:
      # 운영 인증정보는 환경변수/Secrets Manager에서만 주입하고 저장소에는 값을 남기지 않는다.
      client-id: ${NAVER_SEARCH_CLIENT_ID}
      client-secret: ${NAVER_SEARCH_CLIENT_SECRET}
    geocode:
      # NCP Maps Geocoding(ADR-0042). search와 별개 콘솔의 자격증명이라 값을 공유하지 않는다.
      client-id: ${NAVER_GEOCODE_CLIENT_ID}
      client-secret: ${NAVER_GEOCODE_CLIENT_SECRET}
  kakao:
    local:
      # 카카오 로컬(ADR-0044). naver와 별개 콘솔의 자격증명이라 값을 공유하지 않는다.
      rest-api-key: ${KAKAO_REST_API_KEY}
  images:
    # 매물 사진 저장소(ADR-0041). 버킷·CDN 도메인은 terraform이 APP_IMAGES_* 로 주입한다(비밀 아님).
    # 자격증명은 설정에 두지 않는다 — 태스크 역할이 임시 자격증명을 준다.
    enabled: ${APP_IMAGES_ENABLED:true}
    bucket: ${APP_IMAGES_BUCKET}
    cdn-domain: ${APP_IMAGES_CDN_DOMAIN}
