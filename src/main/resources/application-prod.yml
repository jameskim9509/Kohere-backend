# 운영 프로파일(SPRING_PROFILES_ACTIVE=prod). 모든 환경 의존값·시크릿은 환경변수/Secrets Manager로 주입한다.
# 폴백 기본값을 두지 않는다 — 누락 시 기동이 실패(fail-fast)해 "조용히 커밋된 시크릿 사용" 사고를 막는다.
# 스키마는 Flyway가 적용하고 Hibernate는 validate만 한다(ADR-0008).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    host: ${SPRING_MAIL_HOST} # 폴백 없음 — 미설정 시 기동 실패
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET} # 폴백 없음 — 미설정 시 기동 실패 (ADR-0011 D5)
  auth:
    refresh-pepper: ${REFRESH_PEPPER} # 폴백 없음 (ADR-0006)
    email-pepper: ${EMAIL_PEPPER} # 폴백 없음 — 이메일 인증번호 해시 pepper
    phone-pepper: ${PHONE_PEPPER} # 폴백 없음 — 연락처 인증번호 해시 pepper(SSM, ADR-0023)
    business-pepper: ${BUSINESS_PEPPER} # 폴백 없음 — 사업자번호 해시 pepper(SSM)
  oidc:
    google:
      audience: ${GOOGLE_CLIENT_ID}
    apple:
      audience: ${APPLE_CLIENT_ID}
  apple:
    # Apple 인가코드 흐름 시크릿 — 폴백 없음(fail-fast). client-id는 oidc.apple.audience와 같은 번들 ID(같은 env 재사용).
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY} # .p8 PKCS#8 PEM — 절대 로깅 금지
  twilio:
    # 연락처 SMS(Twilio, ADR-0034). enabled=true 시 실 발송 — 크리덴셜 미확정 동안 false면 폴백(운영 부적합, 활성화 전 확정 필요).
    enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:} # 1급 시크릿(SSM)
    from-number: ${TWILIO_FROM_NUMBER:}
  bizno:
    # 사업자번호 검증(비즈노, ADR-0033). enabled=true 시 실 검증 — API 계약 확정 전 false면 스텁(운영 부적합).
    enabled: ${BIZNO_ENABLED:false}
    api-key: ${BIZNO_API_KEY:} # 시크릿(SSM)
